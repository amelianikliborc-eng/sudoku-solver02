<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku Solver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Sudoku Solver</h1>

        <p class="subtitle">
            Wpisz cyfry Sudoku i kliknij „Rozwiąż”.
        </p>

        <div id="sudoku-board"></div>

        <div class="buttons">
            <button id="solve-button">Rozwiąż</button>
            <button id="clear-button">Wyczyść</button>
        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
